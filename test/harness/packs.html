<!doctype html>
<meta charset="utf-8">
<title>tiny-speech pack loader harness</title>
<script type="module">
// The pack loader and the places domain, in a browser, for test/loader.test.mjs.
import { createPackLoader } from "/core/pack/loader.js";
import { createAsker, nowAt } from "/domains/places/ask.js";
window.loadCity = async (id, options = {}) => {
  const loader = createPackLoader({ base: "/packs/", cachePrefix: "t", ...options });
  try {
    const r = await loader.load(id);
    return { version: r.version, from: r.from, offline: !!r.offline, warning: r.warning || null, places: r.pack.places.length, tz: r.pack.tz, stored: await loader.storedCities() };
  } catch (e) {
    return { error: e.message };
  }
};
window.ask = async (id, text, iso, lang = "en") => {
  const { pack } = await createPackLoader({ base: "/packs/", cachePrefix: "t" }).load(id);
  const r = createAsker({ pack, lang, random: () => 0.5 }).answer(text, nowAt(pack.tz, new Date(iso)), null, null);
  return { kind: r.kind, ids: r.ids, say: r.say.map((s) => s.text).join(" ") };
};

window.ready = true;
</script>
